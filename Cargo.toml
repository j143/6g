[package]
name = "sixg"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sixg"
path = "src/main.rs"

[[bin]]
name = "sixg-bench"
path = "src/bin/bench.rs"

[[example]]
name = "exp_001_dfrc_pareto_frontier"
path = "experiments/exp_001_dfrc_pareto_frontier/run.rs"

[[example]]
name = "exp_002_phy_baseline_comparison"
path = "experiments/exp_002_phy_baseline_comparison/run.rs"

[[example]]
name = "exp_003_mac_srsran_baseline"
path = "experiments/exp_003_mac_srsran_baseline/run.rs"

[[example]]
name = "exp_004_semantic_ai_phase5"
path = "experiments/exp_004_semantic_ai_phase5/run.rs"

[[example]]
name = "exp_005_e2e_core_session"
path = "experiments/exp_005_e2e_core_session/run.rs"

[[example]]
name = "exp_006_open5g_core_comparison"
path = "experiments/exp_006_open5g_core_comparison/run.rs"

[[example]]
name = "exp_007_ueransim_gnb_comparison"
path = "experiments/exp_007_ueransim_gnb_comparison/run.rs"

[[example]]
name = "exp_008_onnx_semantic_codec"
path = "experiments/exp_008_onnx_semantic_codec/run.rs"

[[example]]
name = "exp_009_5g_vs_6g_full_stack"
path = "experiments/exp_009_5g_vs_6g_full_stack/run.rs"

[dependencies]
sixg-common  = { path = "crates/6g-common" }
sixg-phy     = { path = "crates/6g-phy" }
sixg-mac     = { path = "crates/6g-mac" }
sixg-rlc     = { path = "crates/6g-rlc" }
sixg-pdcp    = { path = "crates/6g-pdcp" }
sixg-rrc     = { path = "crates/6g-rrc" }
sixg-isac    = { path = "crates/6g-isac" }
sixg-ai      = { path = "crates/6g-ai" }
sixg-ntn     = { path = "crates/6g-ntn" }
sixg-semantic = { path = "crates/6g-semantic" }
sixg-core    = { path = "crates/6g-core" }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
## Core tier: zero native dependencies.  Always enabled.
default = []
## Baseline tier: enable Level-2 CSV baseline comparison tests in 6g-phy.
## Activate with: cargo build --features=baseline-comparison
baseline-comparison = ["sixg-phy/baseline-comparison"]
## ONNX tier: gate real ort-based ONNX sentence-transformer inference.
## Requires libonnxruntime and a model file.  See install.sh --onnx.
onnx = ["sixg-ai/onnx", "sixg-semantic/onnx"]
## Plotting tier: compile-time marker enabling CSV / JSON artefact output.
## Python plots are handled separately via scripts/plot_*.py.
plotting = []

[workspace]
resolver = "2"
members = [
    ".",
    "crates/6g-common",
    "crates/6g-phy",
    "crates/6g-mac",
    "crates/6g-rlc",
    "crates/6g-pdcp",
    "crates/6g-rrc",
    "crates/6g-isac",
    "crates/6g-ai",
    "crates/6g-ntn",
    "crates/6g-semantic",
    "crates/6g-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["6G Contributors"]
repository = "https://github.com/j143/6g"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
